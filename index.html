<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ToDo-List</title>
</head>
<body>
    <h1>Simple ToDo List</h1>

    <!-- input and btn to add new tools -->
    <input type="text" id="todo-input" placeholder="Enter a task and press Add">

    <button id="add-btn">Add</button>

    <div>
        <button id="all-btn">All</button>
        <button id="active-btn">Active</button>
        <button id="completed-btn">Completed</button>
    </div>
    
    <ul id="todo-list"></ul>
    <script src="script.js"></script>
</body>
</html>
